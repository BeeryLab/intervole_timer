# Publishes v2_web/ as the site root at https://beerylab.github.io/intervole_timer/
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['v2_web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2_web
      - id: deployment
        uses: actions/deploy-pages@v4
